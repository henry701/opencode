name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force merge even if already up-to-date'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4.2.2
        with:
          ref: production
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        shell: bash
        run: |
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/anomalyco/opencode.git
          fi
          git fetch upstream production

      - name: Check if up-to-date
        id: check
        shell: bash
        env:
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          if git merge-base --is-ancestor upstream/production HEAD && [[ "$FORCE_INPUT" != "true" ]]; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
          else
            echo "status=pending" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.status == 'pending'
        shell: bash
        run: |
          upstream_hash=$(git rev-parse upstream/production)
          upstream_short=$(git rev-parse --short upstream/production)
          upstream_log=$(git log HEAD..upstream/production --oneline | head -20 || true)

          if git merge --no-edit upstream/production; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
            echo "upstream_hash=${upstream_hash}" >> "$GITHUB_OUTPUT"
            echo "upstream_short=${upstream_short}" >> "$GITHUB_OUTPUT"
            {
              echo "upstream_log<<EOF"
              echo "$upstream_log"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            conflicted=$(git diff --name-only --diff-filter=U | paste -sd ',' - || echo "")
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "upstream_hash=${upstream_hash}" >> "$GITHUB_OUTPUT"
            echo "upstream_short=${upstream_short}" >> "$GITHUB_OUTPUT"
            echo "conflicted_files=${conflicted}" >> "$GITHUB_OUTPUT"
            {
              echo "upstream_log<<EOF"
              echo "$upstream_log"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged changes
        if: steps.merge.outputs.status == 'merged'
        shell: bash
        run: git push origin production

      - name: Report conflict to job summary
        if: steps.merge.outputs.status == 'conflict'
        shell: bash
        env:
          UPSTREAM_HASH: ${{ steps.merge.outputs.upstream_hash }}
          UPSTREAM_SHORT: ${{ steps.merge.outputs.upstream_short }}
          CONFLICTED_FILES: ${{ steps.merge.outputs.conflicted_files }}
          UPSTREAM_LOG: ${{ steps.merge.outputs.upstream_log }}
        run: |
          conflicted_files_nl="${CONFLICTED_FILES//,/$'\n'}"
          cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY_EOF
          ## ⚠️ Upstream sync conflict — manual merge required

          **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")
          **Upstream commit:** \`${UPSTREAM_SHORT}\` (${UPSTREAM_HASH})

          ### Conflicting files
          \`\`\`
          ${conflicted_files_nl}
          \`\`\`

          ### Incoming upstream commits
          \`\`\`
          ${UPSTREAM_LOG}
          \`\`\`

          ### Resolve locally
          \`\`\`bash
          git fetch upstream production
          git checkout production
          git merge upstream/production
          # fix conflicts, then:
          git add .
          git commit
          git push origin production
          \`\`\`
          SUMMARY_EOF
          exit 1
