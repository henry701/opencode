name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force merge even if already up-to-date'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4.2.2
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        shell: bash
        run: |
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/anomalyco/opencode.git
          fi
          git fetch upstream dev

      - name: Check if up-to-date
        id: check
        shell: bash
        env:
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          if git merge-base --is-ancestor upstream/dev HEAD && [[ "$FORCE_INPUT" != "true" ]]; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
          else
            echo "status=pending" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.status == 'pending'
        shell: bash
        run: |
          upstream_hash=$(git rev-parse upstream/dev)
          upstream_short=$(git rev-parse --short upstream/dev)
          upstream_log=$(git log HEAD..upstream/dev --oneline | head -20)

          if git merge --no-edit upstream/dev; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
            echo "upstream_hash=${upstream_hash}" >> "$GITHUB_OUTPUT"
            echo "upstream_short=${upstream_short}" >> "$GITHUB_OUTPUT"
            {
              echo "upstream_log<<EOF"
              echo "$upstream_log"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            conflicted=$(git diff --name-only --diff-filter=U | paste -sd ',' - || echo "")
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "upstream_hash=${upstream_hash}" >> "$GITHUB_OUTPUT"
            echo "upstream_short=${upstream_short}" >> "$GITHUB_OUTPUT"
            echo "conflicted_files=${conflicted}" >> "$GITHUB_OUTPUT"
            {
              echo "upstream_log<<EOF"
              echo "$upstream_log"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged changes
        if: steps.merge.outputs.status == 'merged'
        shell: bash
        run: git push origin dev

      - name: Ensure upstream-conflict label exists
        if: steps.merge.outputs.status == 'conflict'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "upstream-conflict" \
            --color "FF4444" \
            --description "Auto-merge from upstream failed due to conflicts" \
            2>/dev/null || true

      - name: Close stale conflict issues on clean merge
        if: steps.check.outputs.status == 'up-to-date' || steps.merge.outputs.status == 'merged'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_numbers=$(gh issue list \
            --label "upstream-conflict" \
            --state open \
            --json number \
            --jq '.[].number' || echo "")
          
          if [[ -n "$issue_numbers" ]]; then
            echo "$issue_numbers" | while IFS= read -r issue_num; do
              [[ -n "$issue_num" ]] && gh issue close "$issue_num" \
                --comment "✅ Upstream sync succeeded — conflict no longer present."
            done
          fi

      - name: Open or update conflict issue
        if: steps.merge.outputs.status == 'conflict'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_HASH: ${{ steps.merge.outputs.upstream_hash }}
          UPSTREAM_SHORT: ${{ steps.merge.outputs.upstream_short }}
          CONFLICTED_FILES: ${{ steps.merge.outputs.conflicted_files }}
          UPSTREAM_LOG: ${{ steps.merge.outputs.upstream_log }}
        run: |
          current_date=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          body=$(cat << 'BODY_EOF'
## ⚠️ Upstream sync failed — manual merge required

**Date:** ${current_date}
**Upstream commit:** `${upstream_short}` (${upstream_hash})

### Conflicting files
```
${CONFLICTED_FILES_NL}
```

### Incoming upstream commits
```
${upstream_log}
```

### Resolve locally
```bash
git fetch upstream dev
git checkout dev
git merge upstream/dev
# fix conflicts, then:
git add .
git commit
git push origin dev
```
BODY_EOF
          )
          
          # Substitute variables in the body
          upstream_hash="$UPSTREAM_HASH"
          upstream_short="$UPSTREAM_SHORT"
          conflicted_files="$CONFLICTED_FILES"
          conflicted_files_nl="${CONFLICTED_FILES//,/$'\n'}"
          upstream_log="$UPSTREAM_LOG"
          body=$(CONFLICTED_FILES_NL="$conflicted_files_nl" \
                 UPSTREAM_HASH="$upstream_hash" \
                 UPSTREAM_SHORT="$upstream_short" \
                 UPSTREAM_LOG="$upstream_log" \
                 current_date="$current_date" \
                 envsubst <<< "$body")

          existing_issue=$(gh issue list \
            --label "upstream-conflict" \
            --state open \
            --json number \
            --jq '.[0].number // empty' || echo "")

          issue_title="⚠️ Upstream sync conflict — $(date -u +%Y-%m-%d)"

          if [[ -n "$existing_issue" ]]; then
            gh issue comment "$existing_issue" --body "$body"
            gh issue edit "$existing_issue" --title "$issue_title"
          else
            gh issue create \
              --title "$issue_title" \
              --body "$body" \
              --label "upstream-conflict"
          fi